name: test
on: push
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4
      - name: Install JVM
        uses: actions/setup-java@v4
        with:
            distribution: 'temurin'
            java-version: '21'
      - name: install dependencies
        run: mvn install
      - name: Run tests
        run: mvn test
  deploy:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Get Code 
        uses: actions/checkout@v4
      - name: Install JVM
        uses: actions/setup-java@v4
        with:
            distribution: 'temurin'
            java-version: '21'
      - name: install dependencies
        run: mvn install
      - name: Build 
        run: mvn clean package
      - name: deploying somewhere
        run: echo "deploying somewhere..."

      


